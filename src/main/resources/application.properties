spring.application.name=bukimind
# -----------------------
# Database
# -----------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# The schema is managed outside the application:
#   existing database -> BukiMindKeycloakMigration.sql (users table alignment)
# For production prefer a migration tool (Flyway/Liquibase) plus:
#   spring.jpa.hibernate.ddl-auto=validate

# -----------------------
# Naming entity mapping table in SQL
# -----------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------
# Show sql
# -----------------------
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -----------------------
# Security - Keycloak resource server
# -----------------------
# Spring Security/Boot discover the JWKS endpoint from the issuer and validate
# signature, issuer and expiration of every Bearer token. No custom JWT code involved.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bukimind}

# -----------------------
# Security - Keycloak proxy endpoints (/api/auth/*)
# -----------------------
# Backend -> Keycloak intermediary: password grant, refresh, logout and user
# registration (Admin API via the backend client's service account). All values
# come from environment variables - never hardcoded.
app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8180}
app.keycloak.realm=${KEYCLOAK_REALM:bukimind}
# Client used for password / refresh grants (the public frontend client).
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:bukimind-frontend}
# Only needed if that client is confidential; leave empty for a public client.
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
# Backend service-account client (Client authentication + Service accounts ON).
app.keycloak.backend-client-id=${KEYCLOAK_BACKEND_CLIENT_ID:bukimind-backend}
app.keycloak.backend-client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET:}

# Authentication is fully delegated to Keycloak, so Spring Boot must not
# create its default in-memory user (and log a random password).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# -----------------------
# CORS - explicit frontend origins, comma separated
# e.g. https://bukimind-frontend-ecru.vercel.app
# 5173 = customer frontend (v2), 5174 = admin frontend (second Vite server)
# -----------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# -----------------------
# Gemini API Configuration
# -----------------------
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}

# -----------------------
# Cloudinary Configuration
# -----------------------
cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# -----------------------
# AI Moderation
# -----------------------
ai.moderation.url=${AI_MODERATION_URL}
